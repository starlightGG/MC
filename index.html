<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minecraft WebGL Edition</title>
  <style>
    :root { --slot: 40px; --slot-img: 32px; }
    @media (max-width: 620px) { :root { --slot: 34px; --slot-img: 26px; } }
    @media (max-width: 420px) { :root { --slot: 28px; --slot-img: 22px; } }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #78a7ff; font-family: 'Courier New', Courier, monospace; touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }

    #overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; z-index: 20; cursor: pointer; text-align: center;
    }
    #overlay h1 { font-size: 42px; margin: 0 0 10px 0; text-shadow: 3px 3px 0 #000; letter-spacing: 2px; }
    #overlay p { font-size: 16px; color: #ddd; margin: 4px 0; text-shadow: 1px 1px 0 #000; }

    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 18px; height: 18px; pointer-events: none; z-index: 5;
    }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: rgba(255, 255, 255, 0.9); mix-blend-mode: difference;
    }
    #crosshair::before { top: 8px; left: 0; width: 18px; height: 2px; }
    #crosshair::after { top: 0; left: 8px; width: 2px; height: 18px; }

    #hud {
      position: fixed; top: 10px; left: 10px; color: #fff;
      text-shadow: 1.5px 1.5px 0 #000; font-size: 13px; line-height: 1.45;
      pointer-events: none; background: rgba(0,0,0,0.35); padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.2); z-index: 5;
    }

    #hotbar-wrap {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      pointer-events: none; z-index: 5;
    }
    #block-label {
      color: #fff; font-size: 14px; font-weight: bold;
      text-shadow: 1.5px 1.5px 0 #000; background: rgba(0,0,0,0.45); padding: 2px 10px;
    }
    #hotbar {
      display: flex; background: rgba(25, 25, 25, 0.85);
      border: 3px solid #111; padding: 3px; gap: 3px;
      box-shadow: inset 0 0 0 2px #555;
    }
    .slot {
      width: 46px; height: 46px; border: 2px solid #444;
      background: rgba(139, 139, 139, 0.35); display: flex;
      align-items: center; justify-content: center; position: relative;
    }
    .slot.active {
      border: 3px solid #fff; background: rgba(255, 255, 255, 0.25);
      transform: scale(1.08); z-index: 2;
    }
    .slot canvas { width: 32px; height: 32px; image-rendering: pixelated; }
    .slot-num {
      position: absolute; top: 1px; left: 3px; font-size: 10px;
      color: #ddd; text-shadow: 1px 1px 0 #000;
    }

    #overlay { image-rendering: pixelated; cursor: default; }
    #menu, #pause, #dead { display: none; flex-direction: column; align-items: center; gap: 12px; }
    #menu h1 { font-size: 68px; letter-spacing: 6px; color: #e6e6e6; text-shadow: 5px 5px 0 #333; margin: 0; }
    #dead h1 { color: #f55; }
    .sub { color: #ffe066; text-shadow: 2px 2px 0 #000; margin-bottom: 14px; }
    .mcbtn { width: 340px; padding: 10px; font: bold 18px "Courier New", monospace; color: #fff; text-shadow: 2px 2px 0 #222; background: #7a7a7a; border: 3px solid; border-color: #d0d0d0 #333 #333 #d0d0d0; cursor: pointer; }
    .mcbtn:hover { background: #6c7fb8; }
    .mcbtn small { display: block; font-size: 11px; font-weight: normal; color: #ddd; }
    #hearts { display: flex; align-self: flex-start; margin-bottom: 2px; }
    .h { font-size: 20px; line-height: 20px; color: #e22; margin-right: 2px; width: 20px; text-align: center; }
    .h.off { color: #3a3a3a; }
    .h.half { background: linear-gradient(90deg, #e22 50%, #3a3a3a 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #hurt { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(190,0,0,.4); opacity: 0; transition: opacity .4s; pointer-events: none; z-index: 6; }

    /* ---------- INVENTORY ---------- */
    #inv {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: none; background: rgba(0, 0, 0, .62); z-index: 30;
      overflow: auto; padding: 10px;
      justify-content: center; align-items: flex-start;
      flex-wrap: wrap; gap: 10px;
      -webkit-overflow-scrolling: touch;
    }
    #inv.open { display: flex; }
    #invPanel {
      background: #c6c6c6;
      border: 4px solid; border-color: #fff #555 #555 #fff;
      outline: 3px solid #000; padding: 12px; color: #333;
      flex: 0 0 auto;
      max-width: calc(100vw - 24px);
    }
    .ititle { font-weight: bold; margin-bottom: 4px; }
    .igrid { display: grid; grid-template-columns: repeat(9, var(--slot)); gap: 2px; margin: 6px 0; }
    .igrid.pal { max-height: 220px; overflow-y: auto; background: #b0b0b0; padding: 2px; }
    .igrid.hb { margin-top: 12px; }
    .crow { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
    .arrow { font-size: 28px; }
    .is {
      width: var(--slot); height: var(--slot);
      background: #8b8b8b;
      border: 2px solid; border-color: #373737 #fff #fff #373737;
      position: relative; display: flex; align-items: center; justify-content: center;
      cursor: pointer; touch-action: manipulation;
    }
    .is:hover { background: #a8a8a8; }
    .is canvas, #cursorItem canvas { width: var(--slot-img); height: var(--slot-img); image-rendering: pixelated; pointer-events: none; }
    .cnt { position: absolute; right: 1px; bottom: 0; color: #fff; font-size: 13px; font-weight: bold; text-shadow: 2px 2px 0 #333; pointer-events: none; }
    #cursorItem { position: fixed; display: none; pointer-events: none; z-index: 40; width: var(--slot-img); height: var(--slot-img); }
    #stats { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
    #hungerWrap { display: flex; flex-direction: column; align-items: flex-end; position: relative; }
    #hunger, #bubbles { display: flex; min-height: 20px; }
    .f { width: 18px; height: 18px; margin-left: 2px; background-size: 18px 18px; background-repeat: no-repeat; image-rendering: pixelated; }
    .bub { color: #7fd0ff; font-size: 14px; margin-left: 2px; }
    #leftStats { display: flex; flex-direction: column; }
    #armorBar { display: none; min-height: 18px; margin-bottom: 2px; }
    .a { width: 16px; height: 16px; margin-right: 2px; clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%); background: #444; }
    .a.full { background: #d8d8d8; }
    .a.half { background: linear-gradient(90deg, #d8d8d8 50%, #444 50%); }
    #hunger { flex-direction: row-reverse; min-height: 20px; align-items: center; }
    #bubbles { position: absolute; right: 0; bottom: 24px; min-height: 0; white-space: nowrap; }
    .steve { width: 80px; height: 160px; image-rendering: pixelated; background: #222; border: 2px solid #373737; flex: 0 0 auto; }

    #settings { display: none; flex-direction: column; align-items: center; gap: 10px; max-height: 92vh; overflow-y: auto; padding: 12px 22px; background: rgba(0,0,0,.55); border: 3px solid #333; color: #fff; text-shadow: 2px 2px 0 #222; font-weight: bold; }
    #settings h1 { font-size: 40px; margin: 0; }
    #settings h2 { font-size: 20px; margin: 4px 0 0; }
    .sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 28px; width: 100%; }
    .sgrid label { display: block; }
    #settings input[type=range] { width: 100%; display: block; }
    #settings select { width: 100%; padding: 5px; font: bold 14px "Courier New", monospace; }
    .bgrid { display: grid; grid-template-columns: auto auto auto auto; gap: 6px 14px; align-items: center; }
    .bbtn { width: auto; min-width: 130px; font-size: 13px; padding: 6px; }
    #book {
      display: none; flex-direction: column; gap: 6px;
      width: max-content; max-width: calc(100vw - 24px);
      max-height: 90vh; overflow-y: auto;
      background: #c6c6c6; border: 4px solid; border-color: #fff #555 #555 #fff;
      outline: 3px solid #000; padding: 10px; color: #333; font-weight: bold;
      flex: 0 0 auto;
    }
    .bgrid2 { display: grid; grid-template-columns: repeat(5, var(--slot)); gap: 2px; }
    .bpat { display: grid; gap: 2px; }
    .is.can { border-color: #2a8a2a #8fff8f #8fff8f #2a8a2a; }
    .is.sel { outline: 2px solid #fff; }

    /* ---------- Mobile / touch ---------- */
    #touchUI { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 8; }
    #joy { position: absolute; left: 18px; bottom: 96px; width: 130px; height: 130px; border-radius: 50%; background: rgba(0,0,0,.25); border: 2px solid rgba(255,255,255,.45); pointer-events: auto; touch-action: none; }
    #joyKnob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(255,255,255,.6); border: 2px solid rgba(0,0,0,.35); }
    #tbtns { position: absolute; right: 14px; bottom: 96px; display: grid; grid-template-columns: repeat(2, 60px); gap: 8px; pointer-events: auto; }
    .tb { width: 60px; height: 60px; border-radius: 50%; padding: 0; background: rgba(0,0,0,.42); border: 2px solid rgba(255,255,255,.55); color: #fff; font: bold 12px/1 "Courier New", monospace; letter-spacing: .5px; display: flex; align-items: center; justify-content: center; text-align: center; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .tb.on, .tb:active { background: rgba(110,170,255,.65); }
    #hotbar .slot { pointer-events: auto; cursor: pointer; }
    @media (max-width: 760px) {
      .slot { width: 38px; height: 38px; }
      .slot canvas { width: 26px; height: 26px; }
      #joy { width: 112px; height: 112px; bottom: 84px; }
      #tbtns { grid-template-columns: repeat(2, 54px); bottom: 84px; }
      .tb { width: 54px; height: 54px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="menu">
      <h1>MINECRAFT</h1><div class="sub">Web Edition &middot; Fan Recreation</div>
      <button class="mcbtn" onclick="startGame('survival')">Survival Mode<small>Mine, craft, fight mobs</small></button>
      <button class="mcbtn" onclick="startGame('creative')">Creative Mode<small>Fly, infinite blocks, instant break</small></button>
      <button class="mcbtn" onclick="openSet('menu')">Settings</button>
      <p><b>WASD</b> move &middot; <b>Space</b> jump (double-tap = fly, Creative) &middot; <b>Ctrl</b> sprint &middot; <b>Shift</b> sneak</p>
      <p><b>Left click</b> mine / attack (hold) &middot; <b>Right click</b> place / eat / crafting table &middot; <b>E</b> inventory &middot; <b>1-9</b> hotbar</p>
    </div>
    <div id="pause"><h1>Game Paused</h1>
      <button class="mcbtn" onclick="resume()">Back to Game</button><button class="mcbtn" onclick="openSet('pause')">Settings</button>
      <button class="mcbtn" onclick="location.reload()">Quit to Title</button></div>
    <div id="dead"><h1>You died!</h1><button class="mcbtn" onclick="respawn()">Respawn</button></div>
    <div id="settings"><h1>Settings</h1>
      <div class="sgrid">
        <label>FOV: <b id="fovv"></b>&deg;<input id="fovr" type="range" min="50" max="110"></label>
        <label>Render Distance: <b class="rdv"></b> chunks<input class="rd" type="range" min="2" max="10" oninput="setRD(this.value)"></label>
        <label>Fog: <b id="fogv"></b><input id="fogr" type="range" min="0" max="150" step="10"></label>
        <label>Shader<select id="shsel"></select></label>
      </div>
      <h2>Key Binds</h2><div id="binds" class="bgrid"></div>
      <button class="mcbtn" onclick="setDone()">Done</button>
    </div>
  </div>
  <div id="inv"><div id="invPanel"></div></div>
  <div id="cursorItem"></div>
  <div id="hurt"></div>

  <div id="touchUI">
    <div id="joy"><div id="joyKnob"></div></div>
    <div id="tbtns">
      <button type="button" tabindex="-1" class="tb" id="tbMine">MINE</button>
      <button type="button" tabindex="-1" class="tb" id="tbPlace">USE</button>
      <button type="button" tabindex="-1" class="tb" id="tbJump">JUMP</button>
      <button type="button" tabindex="-1" class="tb" id="tbDown">DOWN</button>
      <button type="button" tabindex="-1" class="tb" id="tbFly">FLY</button>
      <button type="button" tabindex="-1" class="tb" id="tbInv">BAG</button>
    </div>
  </div>

  <div id="hud"></div>
  <div id="crosshair"></div>
  <div id="hotbar-wrap">
    <div id="block-label"></div>
    <div id="stats"><div id="leftStats"><div id="armorBar"></div><div id="hearts"></div></div><div id="hungerWrap"><div id="bubbles"></div><div id="hunger"></div></div></div><div id="hotbar"></div>
  </div>
  <canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const overlay = document.getElementById("overlay");
const gl = canvas.getContext("webgl", { antialias: false });

// --- 0. POINTER LOCK + MOBILE HELPERS --------------------------------------
const touchUIEl = document.getElementById("touchUI");
const IS_TOUCH = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
let fallbackLook = false, lastTouchT = -9999, tMoveX = 0, tMoveY = 0;

function lockPointer() {
  if (IS_TOUCH) { fallbackLook = true; return; }
  try {
    const p = canvas.requestPointerLock();
    if (p && typeof p.catch === "function") p.catch(() => { fallbackLook = true; });
  } catch (e) { fallbackLook = true; }
  setTimeout(() => { if (document.pointerLockElement !== canvas) fallbackLook = true; }, 500);
}
function beginPlay() {
  ui = "play";
  overlay.style.display = "none";
  if (touchUIEl) touchUIEl.style.display = IS_TOUCH ? "block" : "none";
  lockPointer();
}

// --- 1. WEB AUDIO SYNTHESIZER ---
let audioCtx = null;
function playBlockSound(type, place) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    let baseFreq = 130;
    if (type === 3 || type === 4 || type === 9 || type === 12) baseFreq = 210;
    if (type === 8) baseFreq = 165;
    if (type === 10) baseFreq = 440;
    if (type === 5 || type === 6) baseFreq = 155;
    osc.type = (type === 10) ? "sine" : "triangle";
    osc.frequency.setValueAtTime(place ? baseFreq * 1.2 : baseFreq * 0.85, t);
    osc.frequency.exponentialRampToValueAtTime(place ? baseFreq * 0.7 : 42, t + 0.09);
    gain.gain.setValueAtTime(0.14, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.1);
  } catch (e) {}
}

// --- 2. SHADERS (linear-space lighting, ACES tone map, bloom) ---
const vsSource = `
  attribute vec3 aPos;
  attribute vec2 aUv;
  attribute float aLight;
  uniform mat4 uProj;
  uniform mat4 uView;
  varying vec2 vUv;
  varying float vLight;
  varying float vDist;
  void main() {
    vec4 viewPos = uView * vec4(aPos, 1.0);
    gl_Position = uProj * viewPos;
    vUv = aUv;
    vLight = aLight;
    vDist = length(viewPos.xyz);
  }
`;

const fsSource = `
  #ifdef GL_FRAGMENT_PRECISION_HIGH
  precision highp float;
  #else
  precision mediump float;
  #endif
  uniform sampler2D uTex;
  uniform vec3 uFogColor;
  uniform vec2 uFog;
  uniform float uDay;
  uniform float uSat;
  uniform float uContrast;
  uniform float uBrightness;
  uniform float uPoster;
  uniform vec3 uTint;
  uniform float uVig;
  uniform float uBloom;
  uniform float uTone;
  uniform vec2 uRes;
  varying vec2 vUv;
  varying float vLight;
  varying float vDist;

  vec3 srgb2lin(vec3 c) { return pow(max(c, 0.0), vec3(2.2)); }
  vec3 lin2srgb(vec3 c) { return pow(max(c, 0.0), vec3(1.0 / 2.2)); }
  vec3 aces(vec3 x) {
    const float a = 2.51, b = 0.03, cc = 2.43, d = 0.59, e = 0.14;
    return clamp((x * (a * x + b)) / (x * (cc * x + d) + e), 0.0, 1.0);
  }

  void main() {
    vec4 tex = texture2D(uTex, vUv);
    if (tex.a < 0.1) discard;

    vec3 base = srgb2lin(tex.rgb);
    float lit = vLight * mix(0.28, 1.0, uDay);
    vec3 col = base * lit;

    vec3 fogL = srgb2lin(uFogColor);
    float fogF = clamp((vDist - uFog.x) / (uFog.y - uFog.x), 0.0, 1.0);
    col = mix(col, fogL, fogF);

    col *= uTint;

    float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
    col = mix(vec3(lum), col, uSat);

    col *= uBrightness;

    if (uTone > 0.5) col = aces(col);

    col = lin2srgb(col);

    col = (col - 0.5) * uContrast + 0.5;

    col += smoothstep(0.75, 1.0, col) * uBloom;

    if (uPoster > 1.0) col = floor(col * uPoster + 0.5) / uPoster;

    vec2 q = gl_FragCoord.xy / uRes - 0.5;
    col *= 1.0 - uVig * dot(q, q) * 2.2;

    gl_FragColor = vec4(col, tex.a);
  }
`;

const lineVs = `
  attribute vec3 aPos;
  uniform mat4 uProj;
  uniform mat4 uView;
  void main() { gl_Position = uProj * uView * vec4(aPos, 1.0); }
`;
const lineFs = `
  precision mediump float;
  void main() { gl_FragColor = vec4(0.0, 0.0, 0.0, 0.78); }
`;

function createProgram(vs, fs) {
  const p = gl.createProgram();
  const s1 = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(s1, vs); gl.compileShader(s1);
  const s2 = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(s2, fs); gl.compileShader(s2);
  gl.attachShader(p, s1); gl.attachShader(p, s2); gl.linkProgram(p);
  return p;
}

const prog = createProgram(vsSource, fsSource);
const lineProg = createProgram(lineVs, lineFs);

// Cache uniform / attribute locations once (avoids per-frame lookups)
const U = {
  proj: gl.getUniformLocation(prog, "uProj"),
  view: gl.getUniformLocation(prog, "uView"),
  tex: gl.getUniformLocation(prog, "uTex"),
  fogColor: gl.getUniformLocation(prog, "uFogColor"),
  fog: gl.getUniformLocation(prog, "uFog"),
  day: gl.getUniformLocation(prog, "uDay"),
  sat: gl.getUniformLocation(prog, "uSat"),
  contrast: gl.getUniformLocation(prog, "uContrast"),
  brightness: gl.getUniformLocation(prog, "uBrightness"),
  poster: gl.getUniformLocation(prog, "uPoster"),
  tint: gl.getUniformLocation(prog, "uTint"),
  vig: gl.getUniformLocation(prog, "uVig"),
  bloom: gl.getUniformLocation(prog, "uBloom"),
  tone: gl.getUniformLocation(prog, "uTone"),
  res: gl.getUniformLocation(prog, "uRes")
};
const A = {
  pos: gl.getAttribLocation(prog, "aPos"),
  uv: gl.getAttribLocation(prog, "aUv"),
  light: gl.getAttribLocation(prog, "aLight")
};
const LU = {
  proj: gl.getUniformLocation(lineProg, "uProj"),
  view: gl.getUniformLocation(lineProg, "uView"),
  pos: gl.getAttribLocation(lineProg, "aPos")
};

// --- 3. 16x16 PIXEL-ART TEXTURE ATLAS ---
const TILE = 16;
const ATLAS_COLS = 64;
const atlasCanvas = document.createElement("canvas");
atlasCanvas.width = TILE * ATLAS_COLS;
atlasCanvas.height = TILE;
const actx = atlasCanvas.getContext("2d");

let seed = 42069;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

function drawTile(idx, fn) {
  actx.save();
  actx.translate(idx * TILE, 0);
  actx.clearRect(0, 0, TILE, TILE);
  fn(actx);
  actx.restore();
}

function noiseFill(ctx, colors, pxSize = 1) {
  for (let y = 0; y < TILE; y += pxSize) {
    for (let x = 0; x < TILE; x += pxSize) {
      ctx.fillStyle = colors[Math.floor(rand() * colors.length)];
      ctx.fillRect(x, y, pxSize, pxSize);
    }
  }
}

drawTile(0, c => noiseFill(c, ["#599e36", "#4e8d2e", "#66b03f", "#457e27"]));
drawTile(1, c => {
  noiseFill(c, ["#866043", "#79553a", "#936b4b", "#6b4a32"]);
  for (let x = 0; x < TILE; x++) {
    const drop = 2 + Math.floor(rand() * 3);
    c.fillStyle = (x % 2 === 0) ? "#599e36" : "#4e8d2e";
    c.fillRect(x, 0, 1, drop);
  }
});
drawTile(2, c => noiseFill(c, ["#866043", "#79553a", "#936b4b", "#6b4a32"]));
drawTile(3, c => noiseFill(c, ["#7d7d7d", "#747474", "#888888", "#6b6b6b"]));

const P = (c, x, y, col) => { c.fillStyle = col; c.fillRect(x, y, 1, 1); };
const pickOf = a => a[Math.floor(rand() * a.length)];

// Cobblestone (voronoi rocks with dark seams)
drawTile(4, c => {
  const S = []; for (let i = 0; i < 7; i++) S.push([rand() * 16, rand() * 16]);

  const rLen = Math.hypot(rx, rz);
  rx /= rLen; rz /= rLen;
  const ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;
  return new Float32Array([
    rx, ux, -fx, 0,
    ry, uy, -fy, 0,
    rz, uz, -fz, 0,
    -(rx * ex + ry * ey + rz * ez),
    -(ux * ex + uy * ey + uz * ez),
    -(-fx * ex - fy * ey - fz * ez),
    1
  ]);
}

const hudEl = document.getElementById("hud");
gl.enable(gl.DEPTH_TEST);
gl.enable(gl.CULL_FACE);
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

let lastTime = performance.now();
let currentFov = 1.22;

function frame(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  updateChunks(2, renderDist + 1);
  dayT = (dayT + dt / 360) % 1;

  if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  if (ui === "play") updatePhysics(dt);

  const targetFov = (S.fov + (player.sprinting ? 7 : 0)) * Math.PI / 180;
  currentFov += (targetFov - currentFov) * Math.min(1, dt * 10);

  const bobY = Math.abs(Math.sin(player.bobTimer)) * 0.045;
  const eyeX = player.x, eyeY = player.y + player.eyeHeight - bobY, eyeZ = player.z;
  const look = getLookVector();
  targetBlock = raycast(eyeX, eyeY, eyeZ, look.dx, look.dy, look.dz, 6.0);
  if (ui === "play") updateGame(dt, eyeX, eyeY, eyeZ, look);

  const headInWater = isWater(getBlock(Math.floor(eyeX), Math.floor(eyeY), Math.floor(eyeZ)));
  const dayF = dayFactor(), sk = 0.06 + 0.94 * dayF;
  const fogR = (headInWater ? 0.12 : 0.47) * sk;
  const fogG = (headInWater ? 0.30 : 0.65) * sk;
  const fogB = (headInWater ? 0.72 : 1.00) * sk;

  gl.clearColor(fogR, fogG, fogB, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const proj = perspective(currentFov, canvas.width / canvas.height, 0.1, renderDist * 16 + 40);
  const view = lookAtMatrix(eyeX, eyeY, eyeZ, look.dx, look.dy, look.dz);

  gl.useProgram(prog);
  gl.uniformMatrix4fv(U.proj, false, proj);
  gl.uniformMatrix4fv(U.view, false, view);
  gl.uniform3f(U.fogColor, fogR, fogG, fogB);
  const fe = S.fog ? renderDist * 16 * S.fog / 100 : 1e6;
  gl.uniform2f(U.fog, S.fog ? fe * .55 : 1e6 - 1, fe);
  gl.uniform1f(U.day, dayF);

  // Preset + dynamic sun-based tint modulation
  const G = SHADERS[S.shader] || SHADERS.Default;
  const sunPos = Math.sin(dayT * Math.PI * 2);
  const dawn = Math.max(0, 1 - Math.abs(sunPos) * 3);
  const night = Math.max(0, -sunPos);
  const dTint = [
    1 + dawn * 0.08 - night * 0.08,
    1 - night * 0.04,
    1 - dawn * 0.04 + night * 0.1
  ];
  gl.uniform1f(U.sat, G.sat);
  gl.uniform1f(U.contrast, G.contrast);
  gl.uniform1f(U.brightness, G.bright);
  gl.uniform1f(U.poster, G.poster);
  gl.uniform3f(U.tint, G.tint[0] * dTint[0], G.tint[1] * dTint[1], G.tint[2] * dTint[2]);
  gl.uniform1f(U.vig, G.vig);
  gl.uniform1f(U.bloom, G.bloom);
  gl.uniform1f(U.tone, G.tone);
  gl.uniform2f(U.res, canvas.width, canvas.height);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);

  const posLoc = A.pos, uvLoc = A.uv, lightLoc = A.light;
  gl.bindBuffer(gl.ARRAY_BUFFER, opaqueVbo);
  gl.enableVertexAttribArray(posLoc); gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(uvLoc); gl.vertexAttribPointer(uvLoc, 2, gl.FLOAT, false, 24, 12);
  gl.enableVertexAttribArray(lightLoc); gl.vertexAttribPointer(lightLoc, 1, gl.FLOAT, false, 24, 20);
  drawChunks(false, posLoc, uvLoc, lightLoc);
  drawMobs(posLoc, uvLoc, lightLoc); drawCrack(posLoc, uvLoc, lightLoc);

  if (targetBlock) {
    gl.useProgram(lineProg);
    gl.uniformMatrix4fv(LU.proj, false, proj);
    gl.uniformMatrix4fv(LU.view, false, view);
    gl.bindBuffer(gl.ARRAY_BUFFER, lineVbo);
    gl.bufferData(gl.ARRAY_BUFFER, buildOutline(targetBlock.x, targetBlock.y, targetBlock.z), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(LU.pos);
    gl.vertexAttribPointer(LU.pos, 3, gl.FLOAT, false, 12, 0);
    gl.drawArrays(gl.LINES, 0, 24);
  }

  gl.useProgram(prog);
  gl.depthMask(false);
  gl.bindBuffer(gl.ARRAY_BUFFER, transVbo);
  gl.enableVertexAttribArray(posLoc); gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(uvLoc); gl.vertexAttribPointer(uvLoc, 2, gl.FLOAT, false, 24, 12);
  gl.enableVertexAttribArray(lightLoc); gl.vertexAttribPointer(lightLoc, 1, gl.FLOAT, false, 24, 20);
  drawChunks(true, posLoc, uvLoc, lightLoc);
  gl.depthMask(true);

  const state = player.flying ? "FLYING" : (player.crouching ? "CROUCHING" : (player.sprinting ? "SPRINTING" : "WALKING"));
  hudEl.innerHTML = `XYZ: ${player.x.toFixed(1)} / ${player.y.toFixed(1)} / ${player.z.toFixed(1)}<br>State: <b>${state}</b><br>${dayF > .3 ? "Day" : "Night"}`;

  requestAnimationFrame(frame);
}

// --- 11. MOBILE / TOUCH CONTROLS ---
(function () {
  const joy = document.getElementById("joy"), knob = document.getElementById("joyKnob");
  const bMine = document.getElementById("tbMine"), bPlace = document.getElementById("tbPlace");
  const bJump = document.getElementById("tbJump"), bDown = document.getElementById("tbDown");
  const bFly = document.getElementById("tbFly"), bInv = document.getElementById("tbInv");
  if (!joy) return;
  let joyId = null, jx = 0, jy = 0, R = 46;

  function joyMove(e) {
    for (const t of e.changedTouches) {
      if (t.identifier !== joyId) continue;
      let dx = t.clientX - jx, dy = t.clientY - jy;
      const d = Math.hypot(dx, dy);
      if (d > R) { dx = dx / d * R; dy = dy / d * R; }
      knob.style.transform = "translate(" + dx + "px," + dy + "px)";
      tMoveX = dx / R; tMoveY = -dy / R;
    }
    e.preventDefault();
  }
  function joyStart(e) {
    const t = e.changedTouches[0];
    joyId = t.identifier;
    const r = joy.getBoundingClientRect();
    jx = r.left + r.width / 2; jy = r.top + r.height / 2;
    R = r.width / 2 - 12;
    joyMove(e);
    e.preventDefault(); e.stopPropagation();
  }
  function joyEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier !== joyId) continue;
      joyId = null; tMoveX = 0; tMoveY = 0; knob.style.transform = "";
    }
  }
  joy.addEventListener("touchstart", joyStart, { passive: false });
  joy.addEventListener("touchmove", joyMove, { passive: false });
  joy.addEventListener("touchend", joyEnd);
  joy.addEventListener("touchcancel", joyEnd);

  const lookMap = new Map();
  const onUI = el => el && el.closest && el.closest("#touchUI, #hotbar-wrap, #inv, #overlay, #hud, #cursorItem");
  window.addEventListener("touchstart", e => {
    lastTouchT = performance.now();
    if (ui !== "play") return;
    for (const t of e.changedTouches) {
      if (onUI(t.target)) continue;
      lookMap.set(t.identifier, { x: t.clientX, y: t.clientY });
    }
  }, { passive: true });
  window.addEventListener("touchmove", e => {
    if (ui !== "play") return;
    let used = false;
    for (const t of e.changedTouches) {
      const p = lookMap.get(t.identifier); if (!p) continue;
      used = true;
      const dx = t.clientX - p.x, dy = t.clientY - p.y;
      p.x = t.clientX; p.y = t.clientY;
      player.yaw += dx * 0.0045;
      player.pitch = Math.max(-1.55, Math.min(1.55, player.pitch - dy * 0.0045));
    }
    if (used) e.preventDefault();
  }, { passive: false });
  const clearLook = e => { for (const t of e.changedTouches) lookMap.delete(t.identifier); };
  window.addEventListener("touchend", clearLook);
  window.addEventListener("touchcancel", clearLook);

  function hold(el, on, off) {
    el.addEventListener("touchstart", e => { e.preventDefault(); e.stopPropagation(); el.classList.add("on"); on(); }, { passive: false });
    const end = e => { e.preventDefault(); el.classList.remove("on"); off(); };
    el.addEventListener("touchend", end, { passive: false });
    el.addEventListener("touchcancel", end, { passive: false });
  }
  hold(bMine, () => { mouseL = true; }, () => { mouseL = false; });
  hold(bJump, () => { keys[BIND.jump] = true; }, () => { keys[BIND.jump] = false; });
  hold(bDown, () => { keys[BIND.sneak] = true; }, () => { keys[BIND.sneak] = false; });
  bPlace.addEventListener("touchstart", e => { e.preventDefault(); e.stopPropagation(); if (ui === "play") doPlace(); }, { passive: false });
  bFly.addEventListener("touchstart", e => {
    e.preventDefault(); e.stopPropagation();
    if (mode === "creative") { player.flying = !player.flying; player.vy = 0; bFly.classList.toggle("on", player.flying); }
  }, { passive: false });
  bInv.addEventListener("touchstart", e => { e.preventDefault(); e.stopPropagation(); toggleInv(); }, { passive: false });
})();

requestAnimationFrame(frame);
</script>
</body>
